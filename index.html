ão: Desenhei um homem de chapéu preto na mina. Ele conversava com o cristal roxo e o cristal respondia.';DOC['Tradução do Padre']='Tradução: Sete badaladas, vinte e quatro velas. O portão da mina obedece a quem conta: zero, sete, dois, quatro.';KI['Livro Antigo']='Livro de capa de couro, em latim. Só o padre da vila consegue ler.';function npc(id){if(id=='cativo'){if(en.some(e=>e.t=='B')){say(['PADRE ANSELMO: Cuidado! O capataz ainda está aí!']);return}F.padre=1;R[17].o=R[17].o.filter(q=>q[4]!='#101010');bg=paint2(R[17],17);say(['Você solta as cordas. O padre tosse e agarra sua mão.','PADRE ANSELMO: Deus te mandou, filha. Eu vi o que o Coronel fez com o sino e com o sal. Vou para a igreja. Fale comigo lá.'])}else if(id=='padre'){P.hp=Math.min(100,P.hp+40);if(F['Tradução do Padre'])say(['PADRE ANSELMO: O portão da mina obedece à tradução. Que Deus te guarde. (Você se sente mais forte.)']);else if(F['Livro Antigo']){F['Tradução do Padre']=1;delete F['Livro Antigo'];say(['PADRE ANSELMO: Latim de mineiro... O portão responde a uma contagem. Anotei tudo para você.']);toast('NOVO DOCUMENTO: TRADUÇÃO')}else say(['PADRE ANSELMO: Procure um livro antigo, de capa de couro. Deve estar na escola da vila, trancado. Só eu leio aquele latim. (Você se sente mais forte.)'])}}DOC['Prontuário do Coronel']='Prontuário: Paciente zero, Bento Maciel. Internado em 06/12 com febre de sal. Dr. Heitor anotou: pó aplicado, paciente não morre, só deixa de ser gente.';DOC['Diário da Enfermeira']='Diário: O Coronel pagou a reforma da Santa Casa. Em troca, o Dr. Heitor recebia os doentes sem família. Escondi a chave do subsolo no jazigo dos Maciel. Perdão, Senhor.';DOC['Receita da Zefa']='Receita de dona Zefa: Pé de arruda, plantado no dia 03 do mês 09. Chá contra mau-olhado. Dia e mês: 0309.';DOC['Fórmula do Antídoto']='Fórmula do Dr. Heitor: três frascos (A, B e C) misturados na mesa de destilação do laboratório curam o pó. O antídoto salva quem ainda não virou.';KI['Antídoto do Pó']='Frasco com o antídoto. Só ele pode curar o Tião.';['A','B','C'].forEach(k=>KI['Frasco '+k]='Frasco '+k+' do laboratório. Falta misturar na mesa de destilação.');function npc2(id){if(id=='zefa_c'){if(en.some(e=>e.t=='z')){say(['DONA ZEFA: Cuidado, menina! Os pacientes ainda se mexem!']);return}F.zefa=1;F['Receita da Zefa']=1;R[27].o=R[27].o.filter(q=>q[4]!='#3a1a2a');bg=paint2(R[27],27);say(['Você quebra a algema. Dona Zefa respira fundo.','DONA ZEFA: Eu sabia que alguém vinha. Conheço um caminho secreto da Estrada das Carroças até a mina, pelo poço velho.','Ela entrega uma receita amassada: Receita da Zefa. Depois vai esperar na Rua do Comércio.'])}else if(id=='zefa'){if(!F.Atalho){F.Atalho=1;P.hp=100;say(['DONA ZEFA: Pronto. O poço velho da Estrada das Carroças leva direto à mina. (Atalho aberto. Vida restaurada.)'])}else say(['DONA ZEFA: Ande com cuidado, menina. O Tião é forte, mas o pó é mais.'])}else npc(id)}function ending(){const k=(F.padre?1:0)+(F.zefa?1:0)+(F['Antídoto do Pó']?1:0),A=['O Capitão Sombra cai de joelhos. O cristal-mãe racha e a gruta inteira geme.','Entre as correntes partidas, Tião: tremendo, mas vivo.','TIÃO: Eu sabia que você vinha, Jurema.'];if(k==3)A.push('Você abre o frasco do antídoto. O pó roxo some das veias do menino... e do Capitão: ele sorri, enfim livre, e vira cinza.','Na vila, o padre toca o sino. Dona Zefa planta arruda no cemitério. O povo que fugiu começa a voltar.','Lá fora, uma nuvem escura no horizonte. Chuva de verdade.','#FINAL VERDADEIRO|A vila renasce');else if(k>=1)A.push('Sem o antídoto, o pó ainda corre no sangue do Tião. Mas ele respira. Você o carrega para fora.','Alguns da vila se salvaram por sua causa. A chuva vem... tarde, mas vem.','#FINAL BOM|Ainda há esperança');else A.push('Sozinha, você carrega Tião para fora. Ninguém restou para agradecer.','O pó ainda dorme no sal. A seca volta amanhã.','#FINAL AMARGO|O sertão não perdoa');say(A,()=>{st='title'})}function loop(){fr++;gpad();if(PR.n)mus^=1;
